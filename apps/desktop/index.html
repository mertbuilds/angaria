<!doctype html>
<!-- data-theme="light" pins the app to light. The shell (src/shell) follows any
     theme, but the pre-relaunch screens in src/pages draw with light-only
     colors (src/app.css) and turn unreadable in dark mode. Remove the pin
     once the last of them moves to @angaria/ui. -->
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angaria</title>
    <script type="module">
      if (import.meta.env.DEV) {
        import('react-grab');
        // /?ui-gallery opens the component gallery (dev only).
        if (new URLSearchParams(location.search).has('ui-gallery')) {
          location.replace('/ui-gallery.html');
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

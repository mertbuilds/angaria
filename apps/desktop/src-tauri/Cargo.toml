[package]
name = "angaria"
version = "0.1.0"
description = "GİB e-Arşiv faturaları için masaüstü uygulaması"
authors = ["Vinena Studio"]
license = "Proprietary"
repository = "https://github.com/vinenastudio/angaria"
publish = false
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# mcp-bridge: the angaria-mcp stdio bridge the app bundles (bundle.externalBin).
[workspace]
members = ["mcp-bridge"]

[lib]
name = "angaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# preserve_order: MCP client configs keep their key order when the app adds itself.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
# Tilde: newer minors need tauri 2.12, the app is on 2.10.
tauri-plugin-opener = "~2.5"
tauri-plugin-os = "~2.3"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# The built-in MCP server (src/mcp): already in the tree through tauri and reqwest.
base64 = "0.22"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-std", "io-util", "rt-multi-thread"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
